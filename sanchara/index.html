<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <meta name="description" content="SANCHARA helps you move around Bengaluru by bus and metro, and discover the city as a visitor.">
  <title>SANCHARA | Your city. Your journey.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>

  <!-- Decorative route lines. Purely visual, hidden from assistive tech. -->
  <div class="routes" aria-hidden="true">
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" focusable="false">
      <path class="route" pathLength="1" d="M -40 700 C 120 640, 140 470, 260 420 S 380 250, 300 120"/>
      <path class="route route--b" pathLength="1" d="M 1240 120 C 1080 170, 1060 330, 960 390 S 840 560, 920 700"/>
      <g class="stops">
        <circle cx="260" cy="420" r="6"/>
        <circle cx="300" cy="120" r="6"/>
        <circle cx="960" cy="390" r="6"/>
        <circle cx="920" cy="700" r="6"/>
      </g>
      <circle class="traveler" r="4.5"/>
      <circle class="traveler traveler--b" r="4.5"/>
    </svg>
  </div>

  <main class="stage">

    <header class="identity">
      <h1 class="wordmark reveal" style="--d:300">SANCHARA</h1>
      <span class="rule reveal" style="--d:520" aria-hidden="true"></span>
      <p class="tagline reveal" style="--d:600">Your city. Your journey.</p>
    </header>

    <!--
      ROUTES: replace the three href values below with the real paths used in your app
      (for example "/bmtc", "/metro", "/travel-guide" if you use a client-side router).
    -->
    <nav class="cards" aria-label="SANCHARA sections">

      <a class="card card--bus reveal" style="--d:800" href="./bmtc/" data-nav>
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="14" rx="3"/>
            <path d="M4 10h16"/>
            <path d="M7 17v2.5M17 17v2.5"/>
            <circle cx="8" cy="13.5" r=".9" fill="currentColor"/>
            <circle cx="16" cy="13.5" r=".9" fill="currentColor"/>
          </svg>
        </span>
        <span class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </span>
        <span class="card__body">
          <span class="card__title">BMTC</span>
          <span class="card__desc">Explore Bengaluru by bus.</span>
        </span>
      </a>

      <a class="card card--metro reveal" style="--d:950" href="./metro/" data-nav>
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="3" width="14" height="14" rx="4"/>
            <path d="M5 10h14"/>
            <path d="M8 21l2-4M16 21l-2-4"/>
            <circle cx="9" cy="13.5" r=".9" fill="currentColor"/>
            <circle cx="15" cy="13.5" r=".9" fill="currentColor"/>
          </svg>
        </span>
        <span class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </span>
        <span class="card__body">
          <span class="card__title">Namma Metro</span>
          <span class="card__desc">Find your way across the city.</span>
        </span>
      </a>

      <a class="card card--guide card--wide reveal" style="--d:1100" href="./travel-guide/" data-nav>
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path class="needle" d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5Z"/>
          </svg>
        </span>
        <span class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </span>
        <span class="card__body">
          <span class="card__title">Travel Guide</span>
          <span class="card__desc">Discover places, experiences and hidden gems.</span>
        </span>
      </a>

    </nav>
  </main>

  <script src="js/landing.js" defer></script>
</body>
</html>
