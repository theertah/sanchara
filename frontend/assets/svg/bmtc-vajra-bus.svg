<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <linearGradient id="vajraBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143C6D" />
      <stop offset="40%" stop-color="#1B5599" />
      <stop offset="80%" stop-color="#173B64" />
      <stop offset="100%" stop-color="#0E233C" />
    </linearGradient>
    <linearGradient id="vajraGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2A3A" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#2D4D68" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#132333" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97662" />
      <stop offset="50%" stop-color="#FFB3A3" />
      <stop offset="100%" stop-color="#D97662" />
    </linearGradient>
    <filter id="vajraGlow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0D2035" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#vajraGlow)">
    <!-- Roof AC Climate Pod Unit -->
    <rect x="180" y="24" width="180" height="18" rx="8" fill="#143152" stroke="#102B49" stroke-width="1.5" />
    <line x1="210" y1="30" x2="210" y2="38" stroke="#77808C" stroke-width="2" />
    <line x1="230" y1="30" x2="230" y2="38" stroke="#77808C" stroke-width="2" />
    <line x1="250" y1="30" x2="250" y2="38" stroke="#77808C" stroke-width="2" />
    <line x1="270" y1="30" x2="270" y2="38" stroke="#77808C" stroke-width="2" />
    <line x1="290" y1="30" x2="290" y2="38" stroke="#77808C" stroke-width="2" />
    <line x1="310" y1="30" x2="310" y2="38" stroke="#77808C" stroke-width="2" />
    <line x1="330" y1="30" x2="330" y2="38" stroke="#77808C" stroke-width="2" />

    <!-- Aerodynamic Volvo Body (Low Floor) -->
    <path d="M 25 50 Q 35 40 55 40 L 460 40 Q 495 40 515 80 L 515 150 Q 515 160 500 160 L 35 160 Q 25 160 25 150 Z" fill="url(#vajraBody)" />

    <!-- Sleek Continuous Tinted Panoramic Windows -->
    <path d="M 45 52 L 460 52 Q 485 52 505 85 L 505 106 L 45 106 Z" fill="url(#vajraGlass)" stroke="#0E1D2D" stroke-width="1.5" />

    <!-- Window Divider Lines (Subtle) -->
    <line x1="110" y1="52" x2="110" y2="106" stroke="#0E1D2D" stroke-width="2" />
    <line x1="175" y1="52" x2="175" y2="106" stroke="#0E1D2D" stroke-width="2" />
    <line x1="240" y1="52" x2="240" y2="106" stroke="#0E1D2D" stroke-width="2" />
    <line x1="305" y1="52" x2="305" y2="106" stroke="#0E1D2D" stroke-width="2" />
    <line x1="370" y1="52" x2="370" y2="106" stroke="#0E1D2D" stroke-width="2" />
    <line x1="435" y1="52" x2="435" y2="106" stroke="#0E1D2D" stroke-width="2" />

    <!-- Coral Sleek Swoosh Line -->
    <path d="M 30 120 Q 200 115 510 122 L 510 126 Q 200 121 30 126 Z" fill="url(#chromeTrim)" />

    <!-- Vajra Volvo Signature Typography -->
    <text x="135" y="145" font-family="'Manrope', sans-serif" font-size="13" font-weight="900" fill="#FFF9EF" letter-spacing="3">VAJRA</text>
    <text x="210" y="145" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#D97662" letter-spacing="1.5">AC VOLVO 8400</text>

    <!-- Digital Amber Route Display inside upper windshield -->
    <rect x="360" y="58" width="115" height="18" rx="3" fill="#050C14" />
    <text x="417" y="71" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFA500" text-anchor="middle" letter-spacing="1">V-500D AIRPORT</text>

    <!-- Projector Xenon Headlights -->
    <polygon points="508,128 514,131 514,142 506,140" fill="#FFF" />
    <circle cx="510" cy="135" r="3" fill="#00E5FF" />
    <!-- Lower DRL LED strip -->
    <line x1="495" y1="147" x2="512" y2="147" stroke="#FFF" stroke-width="2" />

    <!-- Low Floor Wheel Arches -->
    <path d="M 85 160 A 28 28 0 0 1 150 160 Z" fill="#0E1D2D" />
    <path d="M 380 160 A 28 28 0 0 1 445 160 Z" fill="#0E1D2D" />

    <!-- Alloy Wheels (Low Profile) -->
    <circle cx="118" cy="162" r="23" fill="#15171C" />
    <circle cx="118" cy="162" r="14" fill="#E2E7EE" stroke="#4F5D73" stroke-width="2" />
    <circle cx="118" cy="162" r="5" fill="#143C6D" />

    <circle cx="413" cy="162" r="23" fill="#15171C" />
    <circle cx="413" cy="162" r="14" fill="#E2E7EE" stroke="#4F5D73" stroke-width="2" />
    <circle cx="413" cy="162" r="5" fill="#143C6D" />
  </g>
</svg>
