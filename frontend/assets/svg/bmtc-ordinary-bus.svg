<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ordBusBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A4A7F" />
      <stop offset="65%" stop-color="#173B64" />
      <stop offset="100%" stop-color="#102B49" />
    </linearGradient>
    <linearGradient id="ordCreamStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9EF" />
      <stop offset="100%" stop-color="#F5EDDC" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8D8F0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4A90C0" stop-opacity="0.95" />
    </linearGradient>
    <filter id="busShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#102B49" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#busShadow)">
    <!-- Main Chassis / Bus Body -->
    <rect x="30" y="45" width="460" height="125" rx="18" fill="url(#ordBusBody)" />
    
    <!-- White / Cream BMTC signature horizontal band -->
    <rect x="30" y="115" width="460" height="22" fill="url(#ordCreamStripe)" />
    <rect x="30" y="132" width="460" height="3" fill="#D97662" />

    <!-- BMTC Emblem & Text on side -->
    <circle cx="85" cy="126" r="7" fill="#173B64" />
    <text x="100" y="130" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#173B64" letter-spacing="1.5">BMTC ORDINARY</text>

    <!-- Front Windshield -->
    <path d="M 430 52 L 480 68 Q 486 78 485 108 L 430 108 Z" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />
    
    <!-- Passenger Windows (5 Side Windows) -->
    <rect x="115" y="55" width="55" height="52" rx="4" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />
    <rect x="178" y="55" width="55" height="52" rx="4" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />
    <rect x="241" y="55" width="55" height="52" rx="4" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />
    <rect x="304" y="55" width="55" height="52" rx="4" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />
    <rect x="367" y="55" width="55" height="52" rx="4" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />

    <!-- Driver window -->
    <rect x="50" y="55" width="45" height="52" rx="4" fill="url(#glassGrad)" stroke="#102B49" stroke-width="2" />

    <!-- LED Destination Board -->
    <rect x="230" y="28" width="160" height="18" rx="4" fill="#0C1B2A" stroke="#173B64" stroke-width="1.5" />
    <text x="310" y="41" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFC83B" text-anchor="middle" letter-spacing="1">KBS ➔ MAJESTIC</text>

    <!-- Headlights & Indicator -->
    <circle cx="482" cy="130" r="6" fill="#FFF9EF" stroke="#E6DFD2" stroke-width="1.5" />
    <circle cx="482" cy="144" r="4" fill="#D97662" />

    <!-- Tail Lights -->
    <rect x="28" y="125" width="4" height="20" rx="2" fill="#D97662" />

    <!-- Front & Rear Wheel Arches -->
    <path d="M 85 170 A 30 30 0 0 1 155 170 Z" fill="#102B49" />
    <path d="M 365 170 A 30 30 0 0 1 435 170 Z" fill="#102B49" />

    <!-- Wheels (Outer Tyre, Rim, Cap) -->
    <circle cx="120" cy="170" r="25" fill="#1B1E23" />
    <circle cx="120" cy="170" r="15" fill="#C5CFDC" stroke="#77808C" stroke-width="2" />
    <circle cx="120" cy="170" r="6" fill="#173B64" />

    <circle cx="400" cy="170" r="25" fill="#1B1E23" />
    <circle cx="400" cy="170" r="15" fill="#C5CFDC" stroke="#77808C" stroke-width="2" />
    <circle cx="400" cy="170" r="6" fill="#173B64" />
  </g>
</svg>
