<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" role="img" aria-label="BMTC AC Volvo Vajra Express Transit Coach">
  <defs>
    <!-- Volvo Midnight Navy Body -->
    <linearGradient id="transVajBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16395D"/>
      <stop offset="35%" stop-color="#102C4B"/>
      <stop offset="70%" stop-color="#0B1E34"/>
      <stop offset="100%" stop-color="#051220"/>
    </linearGradient>

    <!-- Aerodynamic Roof -->
    <linearGradient id="transVajRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24507C"/>
      <stop offset="100%" stop-color="#0E2742"/>
    </linearGradient>

    <!-- Panoramic Privacy Glass Ribbon -->
    <linearGradient id="transVajGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C759C" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#1E4B6E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0C2236" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Dynamic Xenon Projector Light Cone (Cyan / Pure White Beam) -->
    <linearGradient id="vajBeamGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="20%" stop-color="#70F0FF" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#00C8EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00C8EB" stop-opacity="0"/>
    </linearGradient>

    <!-- Coral Beltline Accent -->
    <linearGradient id="transVajTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97662"/>
      <stop offset="50%" stop-color="#FFA694"/>
      <stop offset="100%" stop-color="#D97662"/>
    </linearGradient>

    <!-- Motion Blur Filter -->
    <filter id="transVajBlur" x="-10%" y="-20%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
    </filter>
  </defs>

  <!-- ==========================================
       0. PROJECTED XENON FORWARD LIGHT BEAMS
       ========================================== -->
  <polygon points="760,210 920,175 920,315 760,250" fill="url(#vajBeamGlow)" opacity="0.88"/>
  <ellipse cx="830" cy="275" rx="90" ry="25" fill="#70F0FF" opacity="0.25" filter="url(#transVajBlur)"/>

  <!-- Ground contact shadow beneath coach -->
  <ellipse cx="440" cy="285" rx="390" ry="14" fill="#02060C" filter="url(#transVajBlur)" opacity="0.8"/>
  <ellipse cx="440" cy="282" rx="360" ry="7" fill="#010306" opacity="0.85"/>

  <g id="vajraExpressBody">
    <!-- Main Low-Floor Volvo Chassis -->
    <path d="
      M 75 235
      L 75 88
      Q 75 70, 95 70
      L 715 70
      Q 742 70, 758 92
      L 768 138
      Q 772 190, 770 238
      Q 770 250, 756 250
      L 715 250
      A 42 42 0 0 0 631 250
      L 225 250
      A 42 42 0 0 0 141 250
      L 85 250
      Q 75 250, 75 235
      Z"
      fill="url(#transVajBody)" stroke="#050F1A" stroke-width="2.5"/>

    <!-- Aerodynamic Windshield & Roof Cap -->
    <path d="M 95 70 L 715 70 Q 738 70, 750 84 L 85 84 Q 88 70, 95 70 Z" fill="url(#transVajRoof)"/>

    <!-- Volvo Streamlined AC Pod on Roof -->
    <path d="M 240 50 Q 255 36 290 36 L 560 36 Q 595 36 610 50 L 615 68 L 235 68 Z" fill="#0A1E32" stroke="#050F1A" stroke-width="1.5"/>
    <line x1="280" y1="45" x2="280" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="315" y1="45" x2="315" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="350" y1="45" x2="350" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="385" y1="45" x2="385" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="420" y1="45" x2="420" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="455" y1="45" x2="455" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="490" y1="45" x2="490" y2="60" stroke="#24507C" stroke-width="2"/>
    <line x1="525" y1="45" x2="525" y2="60" stroke="#24507C" stroke-width="2"/>

    <!-- Continuous Privacy Glass Ribbon -->
    <path d="M 85 84 L 675 84 L 748 94 Q 760 114, 762 185 L 85 185 Z" fill="url(#transVajGlass)" stroke="#050F1A" stroke-width="2.2"/>
    <line x1="175" y1="84" x2="175" y2="185" stroke="#071524" stroke-width="2"/>
    <line x1="265" y1="84" x2="265" y2="185" stroke="#071524" stroke-width="2"/>
    <line x1="355" y1="84" x2="355" y2="185" stroke="#071524" stroke-width="2"/>
    <line x1="445" y1="84" x2="445" y2="185" stroke="#071524" stroke-width="2"/>
    <line x1="535" y1="84" x2="535" y2="185" stroke="#071524" stroke-width="2"/>
    <line x1="620" y1="84" x2="620" y2="185" stroke="#071524" stroke-width="2"/>

    <!-- Plug Doors -->
    <rect x="590" y="84" width="75" height="166" rx="2" fill="none" stroke="#050F1A" stroke-width="2.2"/>
    <rect x="325" y="84" width="75" height="166" rx="2" fill="none" stroke="#050F1A" stroke-width="2.2"/>

    <!-- Coral & Electric Cyan Beltline -->
    <rect x="75" y="196" width="694" height="6" fill="url(#transVajTrim)"/>
    <line x1="75" y1="204" x2="769" y2="204" stroke="#00E5FF" stroke-width="1.5" opacity="0.8"/>

    <!-- Volvo Vajra Signature Typography -->
    <text x="135" y="230" font-family="'Manrope', sans-serif" font-size="14" font-weight="900" fill="#FFF" letter-spacing="3">VAJRA</text>
    <text x="215" y="230" font-family="'Manrope', sans-serif" font-size="9" font-weight="800" fill="#D97662" letter-spacing="1.5">AIRPORT EXPRESS</text>
    <text x="610" y="230" font-family="'Manrope', sans-serif" font-size="9" font-weight="800" fill="#5890B6" letter-spacing="1">KIA BENGALURU</text>

    <!-- LED Headsign Display -->
    <rect x="670" y="70" width="70" height="20" rx="4" fill="#02060C" stroke="#102C4B" stroke-width="1.5"/>
    <text x="705" y="84" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#FFA500" text-anchor="middle" letter-spacing="1">
      V-500D KIA
    </text>

    <!-- Projector Xenon Headlights Cluster -->
    <polygon points="762,230 770,233 770,252 760,250" fill="#FFF" stroke="#050F1A" stroke-width="1.5"/>
    <circle cx="766" cy="239" r="5" fill="#00E5FF"/>
    <circle cx="766" cy="239" r="2.5" fill="#FFF"/>

    <!-- Swan-Neck Aerodynamic Mirror -->
    <path d="M 748,88 Q 780,80 786,102 L 786,130" fill="none" stroke="#050F1A" stroke-width="3" stroke-linecap="round"/>
    <rect x="781" y="100" width="9" height="30" rx="3" fill="#050F1A"/>
    <rect x="783" y="102" width="5" height="26" rx="2" fill="#00E5FF" opacity="0.6"/>

    <!-- Tail Lights -->
    <rect x="72" y="96" width="6" height="26" rx="2" fill="#D50000"/>
    <rect x="72" y="200" width="6" height="24" rx="2" fill="#FF1744"/>

    <!-- Lower Skirt -->
    <rect x="75" y="244" width="694" height="6" fill="#050F1A"/>
  </g>

  <!-- Volvo Alloy Wheels -->
  <!-- Rear Wheel -->
  <g transform="translate(183, 252)">
    <circle cx="0" cy="0" r="36" fill="#0A0D12" stroke="#030406" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="23" fill="#A0B2C4" stroke="#48596B" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="#102C4B"/>
    <circle cx="0" cy="0" r="5" fill="#D97662"/>
  </g>

  <!-- Front Wheel -->
  <g transform="translate(673, 252)">
    <circle cx="0" cy="0" r="36" fill="#0A0D12" stroke="#030406" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="23" fill="#A0B2C4" stroke="#48596B" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="#102C4B"/>
    <circle cx="0" cy="0" r="5" fill="#D97662"/>
  </g>
</svg>
