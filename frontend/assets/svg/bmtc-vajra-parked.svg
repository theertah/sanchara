<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="100%" role="img" aria-label="BMTC AC Volvo Vajra 3/4 Front Perspective">
  <defs>
    <!-- Volvo Deep Luxury Midnight Navy Gradient -->
    <linearGradient id="vajFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16385D"/>
      <stop offset="35%" stop-color="#102B49"/>
      <stop offset="70%" stop-color="#0B1F35"/>
      <stop offset="100%" stop-color="#061322"/>
    </linearGradient>

    <!-- Side perspective panel gradient -->
    <linearGradient id="vajSideGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#081728"/>
      <stop offset="50%" stop-color="#0E243E"/>
      <stop offset="100%" stop-color="#122E4D"/>
    </linearGradient>

    <!-- Aerodynamic Roof AC Pod -->
    <linearGradient id="vajRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#234E7A"/>
      <stop offset="100%" stop-color="#0F2844"/>
    </linearGradient>

    <!-- Privacy Tinted Panoramic Glass -->
    <linearGradient id="vajGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5692B8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#2D6284" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#183E58" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0B1E2E" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Side Privacy Tinted Glass -->
    <linearGradient id="vajSideGlass" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0A1826" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1C405C" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Xenon Headlight Projector Glow (Electric Cyan / Pure White) -->
    <radialGradient id="vajXenonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="45%" stop-color="#60E8FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00A2C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Coral Trim Line -->
    <linearGradient id="vajCoralTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97662"/>
      <stop offset="50%" stop-color="#FFA08C"/>
      <stop offset="100%" stop-color="#D97662"/>
    </linearGradient>

    <!-- Ground Contact Shadow -->
    <filter id="busGroundShadowVaj" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.03   0 0 0 0 0.08   0 0 0 0 0.15   0 0 0 0 0.5 0"/>
    </filter>
  </defs>

  <!-- Ground Contact Shadow beneath Volvo -->
  <polygon points="50,385 240,400 480,395 510,380 430,365 140,365" fill="#06101C" filter="url(#busGroundShadowVaj)"/>
  <ellipse cx="320" cy="386" rx="160" ry="12" fill="#040A12" opacity="0.7"/>

  <g id="vajraBus3Q">
    <!-- ==========================================
         1. SIDE BODY RECEDING IN PERSPECTIVE (LEFT)
         ========================================== -->
    <!-- Side chassis panel -->
    <polygon points="70,135 185,110 185,365 70,345" fill="url(#vajSideGrad)" stroke="#06121E" stroke-width="2"/>

    <!-- Side roof line & AC pod connection -->
    <polygon points="70,135 185,110 185,85 75,112" fill="#143454" stroke="#06121E" stroke-width="1.5"/>

    <!-- Continuous Privacy Glass Ribbon in perspective -->
    <polygon points="78,142 180,120 180,225 78,225" fill="url(#vajSideGlass)" stroke="#06121E" stroke-width="1.5"/>
    <line x1="110" y1="135" x2="110" y2="225" stroke="#071320" stroke-width="2"/>
    <line x1="145" y1="128" x2="145" y2="225" stroke="#071320" stroke-width="2"/>

    <!-- Sleek Coral & Cyan Aerodynamic Beltline -->
    <polygon points="70,230 185,230 185,245 70,242" fill="url(#vajCoralTrim)"/>
    <line x1="70" y1="247" x2="185" y2="247" stroke="#00E5FF" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Volvo Vajra Side Typography -->
    <text x="125" y="262" font-family="'Manrope', sans-serif" font-size="9" font-weight="900" fill="#FFF" letter-spacing="2">VAJRA</text>

    <!-- Side Rear Alloy Wheel in perspective -->
    <g class="bus-wheel-group" style="transform-box: fill-box; transform-origin: center;">
      <ellipse cx="120" cy="345" rx="22" ry="34" fill="#0C0E12" stroke="#040608" stroke-width="2"/>
      <ellipse cx="120" cy="345" rx="14" ry="22" fill="#8FA2B4"/>
      <!-- Alloy spokes for visible rotation -->
      <line x1="120" y1="324" x2="120" y2="366" stroke="#48596B" stroke-width="2"/>
      <line x1="107" y1="334" x2="133" y2="356" stroke="#48596B" stroke-width="2"/>
      <line x1="107" y1="356" x2="133" y2="334" stroke="#48596B" stroke-width="2"/>
      <ellipse cx="120" cy="345" rx="6" ry="10" fill="#D97662"/>
    </g>

    <!-- ==========================================
         2. VOLVO AERODYNAMIC ROOF & AC DOME
         ========================================== -->
    <!-- Low-floor Streamlined Roof Cap -->
    <path d="M 185,110 Q 185,75 225,66 L 425,66 Q 470,75 470,110 L 185,110 Z" fill="url(#vajRoofGrad)" stroke="#071524" stroke-width="2"/>

    <!-- Streamlined AC Pod on Roof -->
    <path d="M 240,62 Q 250,48 280,48 L 380,48 Q 410,48 420,62 Z" fill="#0D243A" stroke="#071524" stroke-width="1.5"/>
    <!-- AC Louvers -->
    <line x1="285" y1="53" x2="375" y2="53" stroke="#2D5C88" stroke-width="1.5"/>
    <line x1="290" y1="57" x2="370" y2="57" stroke="#2D5C88" stroke-width="1.5"/>

    <!-- Digital Route Matrix Display -->
    <rect x="220" y="80" width="220" height="42" rx="6" fill="#040A12" stroke="#071524" stroke-width="2"/>
    <rect x="226" y="86" width="208" height="30" rx="3" fill="#02050A"/>
    
    <!-- LED Matrix Text Glowing (Orange & Cyan for Airport Vajra) -->
    <text x="330" y="106" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#FFA500" text-anchor="middle" letter-spacing="2">
      V-500D • KIA AIRPORT
    </text>

    <!-- AC Express Badge -->
    <rect x="232" y="90" width="45" height="22" rx="3" fill="#D97662"/>
    <text x="254.5" y="105" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">VAJRA</text>

    <!-- ==========================================
         3. VOLVO PANORAMIC TINTED WINDSHIELD
         ========================================== -->
    <!-- Large Continuous Windshield Glass -->
    <path d="M 190,122 L 465,122 L 462,252 L 190,252 Z" fill="url(#vajGlassGrad)" stroke="#071524" stroke-width="2.5"/>

    <!-- Interior Low-Floor Luxury Dashboard & Driver Controls -->
    <ellipse cx="250" cy="226" rx="22" ry="11" fill="#040B12" opacity="0.8"/>
    <line x1="250" y1="226" x2="250" y2="246" stroke="#040B12" stroke-width="4"/>
    <!-- Digital Instrument Display Glow -->
    <rect x="235" y="235" width="30" height="6" rx="1" fill="#00E5FF" opacity="0.7"/>

    <!-- High-backed Passenger Coach Seats Silhouette right side -->
    <rect x="360" y="185" width="26" height="40" rx="4" fill="#040B12" opacity="0.5"/>
    <rect x="410" y="185" width="26" height="40" rx="4" fill="#040B12" opacity="0.5"/>

    <!-- Aerodynamic Dual Wipers -->
    <line x1="240" y1="252" x2="295" y2="195" stroke="#071524" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="370" y1="252" x2="425" y2="195" stroke="#071524" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ==========================================
         4. VOLVO FRONT LOWER FASCIA & AERODYNAMICS
         ========================================== -->
    <!-- Main Lower Front Fascia Panel -->
    <polygon points="185,252 468,252 464,342 185,347" fill="url(#vajFrontGrad)" stroke="#071524" stroke-width="2.5"/>

    <!-- Signature Volvo Chrome/Coral Diagonal Slash & Iron Mark -->
    <polygon points="185,254 468,254 467,266 185,266" fill="url(#vajCoralTrim)"/>
    <line x1="185" y1="268" x2="467" y2="268" stroke="#00E5FF" stroke-width="1.5" opacity="0.8"/>

    <!-- Volvo Iron Mark Crest in Center -->
    <circle cx="326" cy="288" r="14" fill="#102B49" stroke="#E6DFD2" stroke-width="2"/>
    <line x1="316" y1="298" x2="336" y2="278" stroke="#E6DFD2" stroke-width="2.5"/>
    <text x="326" y="292" font-family="'Manrope', sans-serif" font-size="7" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1">VOLVO</text>

    <!-- Lower Air Dam & Cooling Grille -->
    <rect x="265" y="308" width="122" height="22" rx="4" fill="#040B12" stroke="#071524" stroke-width="1.5"/>
    <line x1="270" y1="314" x2="382" y2="314" stroke="#143454" stroke-width="1.5"/>
    <line x1="270" y1="319" x2="382" y2="319" stroke="#143454" stroke-width="1.5"/>
    <line x1="270" y1="324" x2="382" y2="324" stroke="#143454" stroke-width="1.5"/>

    <!-- ==========================================
         5. PROJECTOR XENON LED HEADLIGHT CLUSTERS
         ========================================== -->
    <!-- Left Projector Cluster (Viewer's Left) -->
    <rect x="198" y="282" width="50" height="34" rx="6" fill="#040C16" stroke="#071524" stroke-width="1.5"/>
    <!-- Xenon Beam Lens -->
    <circle cx="215" cy="299" r="10" fill="url(#vajXenonGlow)" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="215" cy="299" r="4" fill="#FFF"/>
    <!-- Dynamic LED DRL Eyebrow -->
    <path d="M 202,286 L 244,286" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
    <!-- LED Indicator -->
    <circle cx="238" cy="299" r="6" fill="#FF8C00" stroke="#CC7000" stroke-width="1"/>

    <!-- Right Projector Cluster (Viewer's Right) -->
    <rect x="404" y="282" width="50" height="34" rx="6" fill="#040C16" stroke="#071524" stroke-width="1.5"/>
    <!-- Xenon Beam Lens -->
    <circle cx="437" cy="299" r="10" fill="url(#vajXenonGlow)" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="437" cy="299" r="4" fill="#FFF"/>
    <!-- Dynamic LED DRL Eyebrow -->
    <path d="M 408,286 L 450,286" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
    <!-- LED Indicator -->
    <circle cx="414" cy="299" r="6" fill="#FF8C00" stroke="#CC7000" stroke-width="1"/>

    <!-- ==========================================
         6. LOW-FLOOR BUMPER & REGISTRATION
         ========================================== -->
    <!-- Low-profile Sleek Bumper -->
    <polygon points="175,342 478,337 474,374 178,377" fill="#040A12" stroke="#02060A" stroke-width="2.5"/>
    <rect x="195" y="350" width="265" height="3" fill="#00E5FF" opacity="0.7"/>

    <!-- Xenon Fog / Cornering Lamps -->
    <ellipse cx="210" cy="362" rx="8" ry="4" fill="#00E5FF" stroke="#040A12" stroke-width="1"/>
    <ellipse cx="442" cy="360" rx="8" ry="4" fill="#00E5FF" stroke="#040A12" stroke-width="1"/>

    <!-- Official High-Security Registration Plate (Bengaluru Vajra) -->
    <rect x="280" y="348" width="94" height="20" rx="3" fill="#FFF" stroke="#111" stroke-width="1.5"/>
    <rect x="282" y="350" width="10" height="16" fill="#003399"/>
    <text x="287" y="361" font-family="'Manrope', sans-serif" font-size="6" font-weight="800" fill="#FFF" text-anchor="middle">IND</text>
    <text x="337" y="362" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#111" text-anchor="middle" letter-spacing="1">
      KA-57-F-2024
    </text>

    <!-- Front Low-Floor Alloy Wheel in 3/4 perspective (Right side) -->
    <g class="bus-wheel-group" style="transform-box: fill-box; transform-origin: center;">
      <ellipse cx="448" cy="372" rx="18" ry="24" fill="#0C0E12" stroke="#040608" stroke-width="2"/>
      <ellipse cx="448" cy="372" rx="11" ry="15" fill="#8FA2B4"/>
      <!-- Alloy spokes for visible rotation -->
      <line x1="448" y1="358" x2="448" y2="386" stroke="#48596B" stroke-width="2"/>
      <line x1="439" y1="365" x2="457" y2="379" stroke="#48596B" stroke-width="2"/>
      <line x1="439" y1="379" x2="457" y2="365" stroke="#48596B" stroke-width="2"/>
      <ellipse cx="448" cy="372" rx="4" ry="6" fill="#D97662"/>
    </g>

    <!-- ==========================================
         7. VOLVO SWAN-NECK AERODYNAMIC MIRRORS
         ========================================== -->
    <!-- Left Aerodynamic Mirror -->
    <path d="M 188,135 Q 145,118 140,150 L 140,185" fill="none" stroke="#071524" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="132" y="150" width="14" height="36" rx="5" fill="#071524"/>
    <rect x="134" y="152" width="10" height="32" rx="3" fill="#205074"/>

    <!-- Right Aerodynamic Mirror -->
    <path d="M 466,135 Q 508,118 514,150 L 514,185" fill="none" stroke="#071524" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="508" y="150" width="14" height="36" rx="5" fill="#071524"/>
    <rect x="510" y="152" width="10" height="32" rx="3" fill="#205074"/>
  </g>
</svg>
