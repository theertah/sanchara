<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" role="img" aria-label="BMTC High-Speed Express Transit Bus">
  <defs>
    <!-- Royal BMTC Blue gradient -->
    <linearGradient id="transBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#245B94"/>
      <stop offset="30%" stop-color="#184370"/>
      <stop offset="70%" stop-color="#123458"/>
      <stop offset="100%" stop-color="#0B2038"/>
    </linearGradient>

    <!-- Roof gradient -->
    <linearGradient id="transRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C6BA8"/>
      <stop offset="100%" stop-color="#163C66"/>
    </linearGradient>

    <!-- Glowing Windshield Glass -->
    <linearGradient id="transWindshield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AEE4FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#6BBFEA" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#2C729E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Illuminated Passenger Windows (Interior Warm Light Glow) -->
    <linearGradient id="transWinGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFD680" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#C29230" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Dynamic Forward Headlight Beam Cone -->
    <linearGradient id="forwardBeamGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FFEAA7" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#FFD166" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>

    <!-- Ground Contact Shadow with Motion Blur -->
    <filter id="transShadowBlur" x="-10%" y="-20%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
    </filter>

    <!-- BMTC Cream Liveries -->
    <linearGradient id="transCream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9EF"/>
      <stop offset="50%" stop-color="#F5EDDC"/>
      <stop offset="100%" stop-color="#FFF9EF"/>
    </linearGradient>
  </defs>

  <!-- ==========================================
       0. PROJECTED FORWARD HEADLIGHT BEAMS (ILLUMINATES THE ROAD AHEAD)
       ========================================== -->
  <!-- Upper headlight beam cone shooting forward to the right -->
  <polygon points="760,210 920,180 920,310 760,250" fill="url(#forwardBeamGlow)" opacity="0.85"/>
  <!-- Lower road illumination spot -->
  <ellipse cx="830" cy="275" rx="90" ry="25" fill="#FFEAA7" opacity="0.3" filter="url(#transShadowBlur)"/>

  <!-- Ground contact shadow beneath bus -->
  <ellipse cx="440" cy="285" rx="390" ry="14" fill="#030910" filter="url(#transShadowBlur)" opacity="0.75"/>
  <ellipse cx="440" cy="282" rx="360" ry="7" fill="#010408" opacity="0.8"/>

  <g id="expressBusBody">
    <!-- ==========================================
         1. MAIN STREAMLINED BUS CHASSIS (LEVEL & STRAIGHT)
         ========================================== -->
    <path d="
      M 75 235
      L 75 92
      Q 75 74, 95 74
      L 715 74
      Q 740 74, 755 96
      L 765 140
      Q 770 190, 768 238
      Q 768 250, 755 250
      L 715 250
      A 42 42 0 0 0 631 250
      L 225 250
      A 42 42 0 0 0 141 250
      L 85 250
      Q 75 250, 75 235
      Z"
      fill="url(#transBody)" stroke="#091A2E" stroke-width="2.5"/>

    <!-- Aerodynamic Roof Cap -->
    <path d="M 95 74 L 715 74 Q 736 74, 748 88 L 85 88 Q 88 74, 95 74 Z" fill="url(#transRoof)"/>

    <!-- Roof AC Climate Pod with Aero Fins -->
    <rect x="280" y="56" width="280" height="18" rx="6" fill="#0C2542" stroke="#081A2F" stroke-width="1.5"/>
    <line x1="320" y1="62" x2="320" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="350" y1="62" x2="350" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="380" y1="62" x2="380" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="410" y1="62" x2="410" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="440" y1="62" x2="440" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="470" y1="62" x2="470" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="500" y1="62" x2="500" y2="70" stroke="#245B94" stroke-width="2"/>
    <line x1="530" y1="62" x2="530" y2="70" stroke="#245B94" stroke-width="2"/>

    <!-- ==========================================
         2. ILLUMINATED PASSENGER WINDOWS & INTERIOR
         ========================================== -->
    <!-- Large Front Sloped Windshield (Right Face) -->
    <path d="M 670 88 L 744 96 Q 755 116, 758 185 L 670 185 Z" fill="url(#transWindshield)" stroke="#091A2E" stroke-width="2.2"/>
    <!-- Driver silhouette inside -->
    <ellipse cx="695" cy="160" rx="14" ry="12" fill="#0A1E35" opacity="0.75"/>
    <line x1="710" y1="168" x2="725" y2="152" stroke="#0A1E35" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Boarding Double Doors (Glazed) -->
    <rect x="585" y="88" width="75" height="162" rx="2" fill="none" stroke="#091A2E" stroke-width="2.2"/>
    <line x1="622" y1="88" x2="622" y2="250" stroke="#091A2E" stroke-width="2"/>
    <rect x="589" y="94" width="29" height="86" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="1.5"/>
    <rect x="626" y="94" width="29" height="86" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="1.5"/>

    <!-- Panoramic Illuminated Passenger Windows (Glow with warm interior light) -->
    <rect x="495" y="88" width="80" height="92" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="2"/>
    <rect x="405" y="88" width="80" height="92" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="2"/>

    <!-- Mid Exit Double Doors (Glazed) -->
    <rect x="320" y="88" width="75" height="162" rx="2" fill="none" stroke="#091A2E" stroke-width="2.2"/>
    <line x1="357" y1="88" x2="357" y2="250" stroke="#091A2E" stroke-width="2"/>
    <rect x="324" y="94" width="29" height="86" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="1.5"/>
    <rect x="361" y="94" width="29" height="86" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="1.5"/>

    <!-- Rear Passenger Windows -->
    <rect x="230" y="88" width="80" height="92" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="2"/>
    <rect x="145" y="88" width="75" height="92" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="2"/>
    <rect x="85" y="88" width="50" height="92" rx="3" fill="url(#transWinGlow)" stroke="#091A2E" stroke-width="2"/>

    <!-- Passenger Silhouette Accents in Windows -->
    <ellipse cx="535" cy="145" rx="10" ry="9" fill="#0A1E35" opacity="0.6"/>
    <ellipse cx="445" cy="145" rx="10" ry="9" fill="#0A1E35" opacity="0.6"/>
    <ellipse cx="270" cy="145" rx="10" ry="9" fill="#0A1E35" opacity="0.6"/>

    <!-- ==========================================
         3. ICONIC BMTC CREAM & CORAL LIVERY STRIPES
         ========================================== -->
    <rect x="75" y="194" width="692" height="30" fill="url(#transCream)"/>
    <rect x="75" y="220" width="692" height="5" fill="#D97662"/>

    <!-- BMTC Fleet Branding -->
    <circle cx="120" cy="209" r="9" fill="#173B64"/>
    <text x="140" y="213" font-family="'Manrope', sans-serif" font-size="12" font-weight="900" fill="#173B64" letter-spacing="2">BMTC EXPRESS</text>
    <text x="610" y="213" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#173B64" letter-spacing="1.5">BENGALURU</text>

    <!-- ==========================================
         4. HIGH-TECH LED DESTINATION SIGN (AMBER GLOW)
         ========================================== -->
    <rect x="668" y="72" width="70" height="20" rx="4" fill="#04090F" stroke="#163C66" stroke-width="1.5"/>
    <text x="703" y="86" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#FFC107" text-anchor="middle" letter-spacing="1">
      BMTC ➔ CITY
    </text>

    <!-- ==========================================
         5. HEADLIGHTS ASSEMBLY & FORWARD BEAM UNIT
         ========================================== -->
    <!-- Front Projector Assembly on right bumper -->
    <polygon points="760,230 768,233 768,252 758,250" fill="#FFFDF0" stroke="#091A2E" stroke-width="1.5"/>
    <!-- Intense Xenon Core Bulb -->
    <circle cx="765" cy="239" r="5" fill="#FFF"/>
    <!-- Amber Turn Indicator -->
    <circle cx="765" cy="247" r="3" fill="#FF9800"/>

    <!-- Forward Mirror Bracket -->
    <path d="M 744,92 Q 775,85 780,105 L 780,130" fill="none" stroke="#091A2E" stroke-width="3" stroke-linecap="round"/>
    <rect x="775" y="102" width="9" height="30" rx="3" fill="#091A2E"/>
    <rect x="777" y="104" width="5" height="26" rx="2" fill="#6BBFEA"/>

    <!-- ==========================================
         6. REAR TAIL LIGHTS (VIVID RED GLOW ON LEFT)
         ========================================== -->
    <rect x="72" y="98" width="6" height="26" rx="2" fill="#E53935"/>
    <rect x="72" y="200" width="6" height="24" rx="2" fill="#FF1744"/>

    <!-- Lower Chassis Skirt -->
    <rect x="75" y="242" width="692" height="6" fill="#091A2E"/>
  </g>

  <!-- ==========================================
       7. HIGH-SPEED ROTATING WHEELS (CHROME SPOKES)
       ========================================== -->
  <!-- Rear Wheel (Left) -->
  <g transform="translate(183, 252)">
    <circle cx="0" cy="0" r="36" fill="#11151C" stroke="#06080C" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="23" fill="#889BB0" stroke="#465768" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="#173B64"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#D5E0EB" stroke-width="3"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#D5E0EB" stroke-width="3"/>
    <line x1="-13" y1="-13" x2="13" y2="13" stroke="#D5E0EB" stroke-width="3"/>
    <line x1="13" y1="-13" x2="-13" y2="13" stroke="#D5E0EB" stroke-width="3"/>
  </g>

  <!-- Front Wheel (Right) -->
  <g transform="translate(673, 252)">
    <circle cx="0" cy="0" r="36" fill="#11151C" stroke="#06080C" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="23" fill="#889BB0" stroke="#465768" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="#173B64"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#D5E0EB" stroke-width="3"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#D5E0EB" stroke-width="3"/>
    <line x1="-13" y1="-13" x2="13" y2="13" stroke="#D5E0EB" stroke-width="3"/>
    <line x1="13" y1="-13" x2="-13" y2="13" stroke="#D5E0EB" stroke-width="3"/>
  </g>
</svg>
